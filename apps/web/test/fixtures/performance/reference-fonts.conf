<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Reference system fonts for the visual-editor perf fixtures
  (elef-visual-100-*.md + manifest.json).

  Pagination is measured in whole pages, so the manifest's rendered_pages
  counts only reproduce when generic sans-serif/serif resolve to the same
  metrics as the reference layout (Liberation Sans/Serif). Ubuntu runners
  otherwise prefer DejaVu/Noto, which paginates the mixed fixture to 101
  instead of 98. Strong bindings are required: distro configs assign their
  defaults strongly, and weak prepends lose to them.

  Installed by .github/workflows/web-performance.yml into
  /etc/fonts/conf.d/ (after fonts-liberation). Monospace is deliberately
  untouched: the reference resolves code to a different family and the
  count is insensitive to it (verified: DejaVu Sans Mono still 98).
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Serif</string></edit>
  </match>
</fontconfig>
