<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8">
    <style data-host-styles></style>
  </head>
  <body class="elef-app">
    <main class="app-shell">
      <article class="math-shortcut-card settings-card">
        <h2>Vector notation</h2>
        <p>Transform a math shortcut.</p>
      </article>
      <dialog class="authoring-settings-dialog" open>
        <form class="authoring-entry-form">
          <fieldset class="authoring-math-fields">
            <label for="shortcut-expansion">Expansion</label>
            <input id="shortcut-expansion" value="\\lambda">
          </fieldset>
        </form>
      </dialog>
    </main>
  </body>
</html>
