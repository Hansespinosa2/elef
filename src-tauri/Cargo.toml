[package]
name = "elef"
version = "0.1.0"
description = "Elef Markdown presentation renderer"
authors = ["Elef"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["dialog-open", "fs-read-file"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
