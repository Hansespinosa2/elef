[package]
name = "elef"
version = "0.1.0"
description = "Elef Markdown presentation renderer"
authors = ["Elef"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
