default: &default
  adapter: <%= ENV["ELEF_USE_SQLITE"].present? ? "sqlite3" : "postgresql" %>
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "elef_development") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PGPASSWORD"] %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  <% if ENV["ELEF_USE_SQLITE"].present? %>
  database: <%= ENV.fetch("ELEF_SQLITE_DATABASE", "storage/development.sqlite3") %>
  timeout: 5000
  <% end %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("PGTESTDATABASE", "elef_test") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PGPASSWORD"] %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  <% if ENV["ELEF_USE_SQLITE"].present? %>
  database: <%= ENV.fetch("ELEF_SQLITE_DATABASE", "storage/test.sqlite3") %>
  timeout: 5000
  <% end %>

# Production uses DATABASE_URL and optional DATABASE_CACHE_URL /
# DATABASE_QUEUE_URL values supplied by the deployment environment.
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    url: <%= ENV["DATABASE_CACHE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV["DATABASE_QUEUE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
