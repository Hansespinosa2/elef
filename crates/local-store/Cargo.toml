[package]
name = "local-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
trash = "5.2"
unicode-normalization = "0.1"
caseless = "=0.2.2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate-miniz"] }
notify = "8.2.0"
