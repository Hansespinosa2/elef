name: elef-personal

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.personal}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.personal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.personal}
    volumes:
      - elef_personal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env.personal}
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      ELEF_ASSUME_SSL: ${ELEF_ASSUME_SSL:-false}
      ELEF_FORCE_SSL: ${ELEF_FORCE_SSL:-false}
      ELEF_ALLOWED_HOSTS: ${ELEF_ALLOWED_HOSTS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      ELEF_BUILD_ID: ${ELEF_BUILD_ID:-}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - elef_personal_storage:/rails/apps/web/storage
    command: ["sh", "-c", "bin/rails db:migrate && exec bin/rails server -b 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  elef_personal_postgres:
  elef_personal_storage:
