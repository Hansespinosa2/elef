<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elef DAG lineage references</title>
<style>
:root{--bg:#f2f3f5;--ink:#252830;--muted:#737780;--border:#dfe2e7;--blue:#2864d7;--orange:#e48637}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}.shell{max-width:1400px;margin:auto;padding:34px 22px 65px}h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.045em}.lede{color:var(--muted);margin:5px 0 22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}.tabs button.active,.tabs button:hover{background:var(--ink);color:#fff}.mock{display:none;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.mock.active{display:block}.head{padding:18px 20px;border-bottom:1px solid var(--border)}h2{margin:0;font-size:21px}.head p{margin:3px 0;color:var(--muted)}.workspace{display:grid;grid-template-columns:1fr 260px;min-height:560px}.canvas{position:relative;overflow:hidden;background:#fbfcfd}.dag{position:absolute;inset:0;transform-origin:430px 270px}.edges{position:absolute;width:760px;height:540px;pointer-events:none}.edge{fill:none;stroke:#9aa5b6;stroke-width:2}.edge.c{stroke:var(--blue)}.edge.i{stroke:var(--orange);stroke-dasharray:5 5}.node{position:absolute;width:172px;padding:11px 12px;text-align:left;border:1px solid #cfd5de;border-radius:7px;box-shadow:0 4px 12px #26374a12}.node:hover,.node.selected{border-color:var(--blue);box-shadow:0 0 0 3px #2864d722}.node b,.node small{display:block}.node small{color:var(--muted);margin-top:3px}.badge{display:inline-block;margin-top:8px;padding:2px 6px;border-radius:4px;background:#e7efff;color:var(--blue);font-size:10px;text-transform:uppercase}.node.i .badge{background:#fff0e4;color:#b96219}.cluster{position:absolute;border:1px solid #e2e6eb;border-radius:10px;background:#f8fafc}.cluster label{position:absolute;top:-11px;left:12px;background:#f8fafc;color:#77808c;font-size:10px;font-weight:800;text-transform:uppercase;padding:1px 7px}.tools{position:absolute;z-index:4;top:14px;left:14px;display:flex;gap:5px}.tools button{padding:6px 9px;font-size:12px}.details{border-left:1px solid var(--border);padding:20px}.details h3{margin:0 0 5px}.details p{color:var(--muted)}.row{border-top:1px solid var(--border);padding:12px 0}.row b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.legend{margin-top:15px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:25px;border-top:2px solid var(--blue);margin:0 5px}.legend i.d{border-top:2px dotted var(--orange)}
.airflow .canvas{background:#fff}.airflow .node{border-radius:4px}.dagster .canvas{background:#f7f9fb;background-image:radial-gradient(#dfe4ea 1px,transparent 1px);background-size:20px 20px}.dagster .node{border-radius:3px;width:185px}.reactflow .canvas{background:#f8f9fb;background-image:linear-gradient(#e6e9ef 1px,transparent 1px),linear-gradient(90deg,#e6e9ef 1px,transparent 1px);background-size:24px 24px}.reactflow .node{border-top:4px solid #7957d5;border-radius:10px}.github .node{border:0;border-left:4px solid #258a62;border-radius:3px;box-shadow:none}.github .node.i{border-left-color:var(--orange)}.github .edge{stroke-width:3}.cytoscape .canvas{background:#202733}.cytoscape .details{background:#27303c;color:#fff;border-color:#3b4655}.cytoscape .details p,.cytoscape .row b{color:#aeb8c5}.cytoscape .node{background:#303b4a;color:#fff;border-color:#536174}.cytoscape .node small{color:#abb7c5}.cytoscape .cluster{background:#ffffff05;border-color:#526071}.cytoscape .cluster label{background:#202733;color:#aeb8c5}.cytoscape .edge.c{stroke:#79a8ff}.cytoscape .edge.i{stroke:#f0a05a}.cytoscape .tools button{background:#303b4a;color:#fff;border-color:#536174}@media(max-width:800px){.workspace{grid-template-columns:1fr}.details{display:none}.canvas{min-height:560px}}
</style></head><body><main class="shell"><h1>Lineage graph directions</h1><p class="lede">Five references based on real DAG and lineage explorers. Click a tab, then click nodes or use zoom.</p><nav class="tabs"><button class="active" data-show="airflow">1 · Airflow</button><button data-show="dagster">2 · Dagster</button><button data-show="reactflow">3 · React Flow</button><button data-show="github">4 · GitHub network</button><button data-show="cytoscape">5 · Cytoscape</button></nav>
<div id="mocks"></div></main><script>
const concepts=[["airflow","Airflow-style hierarchical graph","Orthodox left-to-right dependency lanes."],["dagster","Dagster-style asset lineage","Compact metadata-rich nodes on a searchable-looking canvas."],["reactflow","React Flow-style node canvas","Grid canvas, handles, zoom controls, and inspector."],["github","GitHub-network-style branch history","Strong branch lines and a history-first reading order."],["cytoscape","Cytoscape-style graph explorer","High-contrast exploratory network with distinct clusters."]];
const trees=[["Quarterly review",[["May review","root",80,80],["June review","c",300,80],["Workshop ideas","i",300,210],["July review","c",520,80]]],["Product thinking",[["Product bets","root",80,370],["Launch narrative","c",300,370],["Customer story","c",520,370]]]];
const paths=[["M252 111 C275 111 275 111 300 111","c"],["M166 120 C166 200 275 220 300 240","i"],["M472 111 C495 111 495 111 520 111","c"],["M252 401 C275 401 275 401 300 401","c"],["M472 401 C495 401 495 401 520 401","c"]];
document.querySelector("#mocks").innerHTML=concepts.map((x,i)=>'<section class="mock '+x[0]+(i===0?' active':'')+'" id="'+x[0]+'"><header class="head"><h2>'+x[1]+'</h2><p>'+x[2]+'</p></header><div class="workspace"><div class="canvas"><div class="tools"><button data-z="-0.1">−</button><button data-z="reset">100%</button><button data-z="0.1">+</button></div><div class="dag"></div></div><aside class="details"><h3>Selected presentation</h3><p>Click any node to inspect it.</p><div class="row"><b>Relationship</b><span class="type">Root presentation</span></div><div class="row"><b>Source snapshot</b><span>Independent Markdown</span></div><div class="legend"><i></i>continuation <i class="d"></i>inspiration</div></aside></div></section>').join("");
document.querySelectorAll(".mock").forEach(section=>{let d=section.querySelector(".dag");d.innerHTML='<svg class="edges" viewBox="0 0 760 540">'+paths.map(p=>'<path class="edge '+p[1]+'" d="'+p[0]+'"/>').join("")+"</svg>"+trees.map(t=>'<div class="cluster" style="left:35px;top:'+(t[1][0][3]-28)+'px;width:680px;height:'+(t[0]==="Quarterly review"?250:145)+'px"><label>'+t[0]+"</label></div>").join("")+trees.flatMap(t=>t[1].map(n=>'<button class="node '+n[1]+'" style="left:'+n[2]+'px;top:'+n[3]+'px"><b>'+n[0]+'</b><small>'+(n[1]==="root"?8:9)+' slides · Markdown</small><span class="badge">'+(n[1]==="root"?"root":n[1]==="c"?"continuation":"inspiration")+"</span></button>")).join("");section.querySelectorAll(".node").forEach(n=>n.onclick=()=>{section.querySelectorAll(".node").forEach(x=>x.classList.remove("selected"));n.classList.add("selected");section.querySelector(".details h3").textContent=n.querySelector("b").textContent;section.querySelector(".type").textContent=n.classList.contains("root")?"Root presentation":"Child "+(n.classList.contains("c")?"continuation":"inspiration")});});
document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button,.mock").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.show).classList.add("active")});document.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{let d=b.closest(".workspace").querySelector(".dag"),z=Number(d.dataset.z||1);z=b.dataset.z==="reset"?1:Math.max(.7,Math.min(1.5,z+Number(b.dataset.z)));d.dataset.z=z;d.style.transform="scale("+z+")"});
</script></body></html>
