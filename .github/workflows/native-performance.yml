name: Native performance (non-gating)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  native-performance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: macos-15
            platform: darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/frontend/package-lock.json
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl dbus-daemon file iptables libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev openbox patchelf unzip webkit2gtk-driver wget xdotool xvfb zip
      - name: Install Rails-owned frontend dependencies
        run: npm ci
      - name: Install desktop frontend dependencies
        run: npm ci --prefix desktop/frontend
      - name: Build Rails Tailwind stylesheet
        run: bin/rails tailwindcss:build
      - name: Build the Rails-owned renderer
        run: npm run renderer:build
      - name: Build the release binary with the measurement hooks
        env:
          ELEF_E2E_BUILD: "1"
        run: npm run tauri:build --prefix desktop/frontend -- --features webdriver --no-bundle --config src-tauri/tauri.e2e.conf.json --config src-tauri/tauri.performance.conf.json
      - name: Record native performance over ten fresh processes
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dbus-run-session -- xvfb-run --auto-servernum bash -c 'openbox --sm-disable >/tmp/elef-performance-openbox.log 2>&1 & sleep 1; node desktop/e2e/benchmark-native.mjs --binary "$PWD/desktop/target/release/elef-desktop" --launch-count 10 --report-runner'
          else
            node desktop/e2e/benchmark-native.mjs --binary "$PWD/desktop/target/release/elef-desktop" --launch-count 10 --report-runner
          fi
      - name: Preserve native performance samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-performance-${{ matrix.platform }}
          path: desktop/target/native-performance-${{ matrix.platform }}.json
          if-no-files-found: warn
