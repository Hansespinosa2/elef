name: Desktop Release Coordinator

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Release control action
        type: choice
        options: [ reconcile, minor, block, unblock ]
        default: reconcile
        required: true
      minor:
        description: New minor milestone, such as 0.2
        type: string
        required: false
      versions:
        description: Comma or space separated release versions for block/unblock
        type: string
        required: false
      reason:
        description: Required authorization reason for a control action
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: elef-desktop-release-coordinator
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    name: Reconcile desktop release state
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: desktop-release-state
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Check out current main history
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
          fetch-depth: 0

      - name: Check out the authoritative Pages state branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile and compare-and-swap publish release state
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DESKTOP_RELEASE_ACTION: ${{ github.event.inputs.action || 'reconcile' }}
          DESKTOP_RELEASE_MINOR: ${{ github.event.inputs.minor }}
          DESKTOP_RELEASE_VERSIONS: ${{ github.event.inputs.versions }}
          DESKTOP_RELEASE_REASON: ${{ github.event.inputs.reason }}
        run: node source/desktop/scripts/publish_desktop_release_state.mjs pages source

      - name: Notify on terminal Gate A failures
        if: steps.publish.outputs.failed_gate_count != '0'
        run: |
          echo "::error::One or more owner-approved main merges failed exact-SHA Gate A. The ledger records failed_gate and no release version was reserved."
          exit 1
