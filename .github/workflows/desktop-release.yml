name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run renderer:build
      - run: npm ci --prefix apps/desktop/frontend
      - name: Prepare signed updater configuration
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          DESKTOP_RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/desktop/scripts/prepare-updater-config.mjs
      - name: Check signing credentials are configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Build and publish macOS updater artifacts
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Absolute CLI path: tauri-action prepends `run` to npm bins, which
          # breaks npm script resolution for compound tauriScript values.
          tauriScript: ${{ github.workspace }}/apps/desktop/frontend/node_modules/.bin/tauri
          args: --config src-tauri/tauri.release.generated.conf.json --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: Elef Desktop ${{ github.ref_name }}
          releaseBody: |
            Updater downloads are signed and verified by Elef before installation.

            [Install and test this build](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/development.md#testing-built-desktop-artifacts)
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  arch-asset:
    needs: macos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and validate the Arch release asset in an official Arch container
        env:
          ELEF_BUILD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir -p target
          export DESKTOP_RELEASE_VERSION="${GITHUB_REF_NAME#desktop-v}"
          docker run --rm --pull=always \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env ELEF_BUILD_SHA \
            --env DESKTOP_RELEASE_VERSION \
            ghcr.io/archlinux/archlinux@sha256:c556b483a8e653aa6389bb66263e1d96cd6e17c67ca5968c87495d313c4a2e93 \
            bash apps/desktop/scripts/arch_package_ci.sh 2>&1 | tee target/arch-package-gate.log
      - name: Upload the Arch asset and sidecars to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A plain Linux Arch archive plus its SHA-256 and provenance sidecars.
        # No updater JSON: Linux upgrades through its package manager (AUR),
        # never through the in-app updater.
        run: |
          version="${RELEASE_TAG#desktop-v}"
          gh release upload "$RELEASE_TAG" \
            "target/arch-release/elef-${version}-x86_64.tar.zst" \
            "target/arch-release/elef-${version}-x86_64.tar.zst.sha256" \
            "target/arch-release/elef-${version}-x86_64.tar.zst.provenance.json" \
            --clobber --repo "$GH_REPO"

  publish:
    needs: [macos, arch-asset]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  aur-publish:
    needs: publish
    # AUR pushing stays off until the maintainer has an AUR account: without
    # the account variable the job skips instead of failing at the
    # desktop-aur-publishing environment gate (its branch policy only allows
    # main, so tag runs can never enter it). When enabling, also add the
    # desktop-v* tag pattern to that environment's branch policy.
    if: vars.AUR_ACCOUNT_NAME != ''
    runs-on: ubuntu-22.04
    environment: desktop-aur-publishing
    steps:
      - uses: actions/checkout@v7
      - name: Publish the AUR package from the public release
        env:
          DESKTOP_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          AUR_ACCOUNT_NAME: ${{ vars.AUR_ACCOUNT_NAME }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          docker run --rm --pull=always \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DESKTOP_RELEASE_TAG \
            --env GITHUB_TOKEN \
            --env GITHUB_REPOSITORY \
            --env AUR_ACCOUNT_NAME \
            --env AUR_SSH_PRIVATE_KEY \
            --env AUR_SSH_KNOWN_HOSTS \
            ghcr.io/archlinux/archlinux@sha256:c556b483a8e653aa6389bb66263e1d96cd6e17c67ca5968c87495d313c4a2e93 \
            bash -c 'pacman-key --init && pacman -Sy --noconfirm archlinux-keyring && pacman -Syu --noconfirm --needed base-devel git nodejs-lts-jod npm openssh && node apps/desktop/scripts/publish_desktop_aur_minimal.mjs /tmp/elef-aur-package'
