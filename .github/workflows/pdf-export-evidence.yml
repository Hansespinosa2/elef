# Print-export evidence (dispatch-only): runs the REAL desktop Export to PDF
# flow end-to-end in the real application binary on the fixed print
# fixtures ("E2E seed" presentation, "E2E document" document), captures the
# exact post-resolve render-time DOM, prints it to PDF bytes with headless
# Chromium and the shipped stylesheets, and renders the ACTUAL PDF pages to
# PNG images plus a machine-readable manifest.
#
# Evidence-only: it never gates, never runs on push/PR, and asserts nothing
# about the fix, so the same dispatch on pre-fix code yields the "before"
# artifacts and on fixed code the "after" ones. Product code is untouched.
name: pdf-export-evidence

on:
  workflow_dispatch:
  # Temporary push trigger so the dispatch-only lane can run from branches
  # (GitHub only registers workflows from the default branch for dispatch).
  # Scoped to the two evidence refs; removed once the artifacts land.
  push:
    branches:
      - fix/desktop-pdf-export-redo
      - evidence/pdf-export-prefix

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/frontend/package-lock.json
            apps/desktop/e2e/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux desktop build dependencies
        run: |
          timeout 600 sudo apt-get update
          timeout 900 sudo apt-get install --yes build-essential curl dbus-daemon file iproute2 libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev openbox patchelf poppler-utils unzip webkit2gtk-driver wget xdotool xvfb zip
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/desktop/frontend
          npm ci --prefix apps/desktop/e2e
      - name: Build the shared packages
        run: npm run build:packages
      - name: Bundle the e2e desktop frontend
        run: npm run build --prefix apps/desktop/frontend
        env:
          ELEF_E2E_BUILD: "1"
      - name: Build the e2e desktop binary
        run: npm run tauri:build --prefix apps/desktop/frontend -- --debug --no-bundle --features desktop-dev,webdriver --config src-tauri/tauri.e2e.conf.json
        env:
          ELEF_E2E_BUILD: "1"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/e2e/package-lock.json') }}
      - name: Install browser operating-system dependencies
        run: npx --prefix apps/desktop/e2e playwright install-deps chromium
      - name: Install headless browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --prefix apps/desktop/e2e playwright install chromium
      - name: Capture the real Export-to-PDF render-time DOM
        run: |
          mkdir -p print-evidence/captures
          dbus-run-session -- xvfb-run --auto-servernum bash -c 'set -o pipefail; openbox --sm-disable >/tmp/elef-print-evidence-openbox.log 2>&1 & sleep 1; node apps/desktop/e2e/print-evidence-run.mjs --evidence-dir print-evidence/captures'
      - name: Print the captured DOM to PDF and render its pages
        run: |
          mkdir -p print-evidence/artifacts
          node apps/desktop/e2e/print-evidence-render.mjs --captures print-evidence/captures --dist apps/desktop/frontend/dist-e2e --out print-evidence/artifacts
      - name: Preserve print-export evidence
        uses: actions/upload-artifact@v7
        with:
          name: pdf-export-evidence
          path: |
            print-evidence/captures
            print-evidence/artifacts
          if-no-files-found: error
