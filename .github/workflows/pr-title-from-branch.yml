name: PR title from branch

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  normalize:
    if: github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Derive title from branch name
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/^(feat|fix|chore)\/(.+)$/);

            if (!match) {
              core.setFailed(
                `Branch "${branch}" must use feat/<description>, fix/<description>, or chore/<description>.`
              );
              return;
            }

            const description = match[2]
              .replace(/[-/]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();

            if (!description) {
              core.setFailed(`Branch "${branch}" must include a description after its prefix.`);
              return;
            }

            const title = `${match[1]}: ${description}`;
            if (context.payload.pull_request.title === title) {
              core.info(`PR title already matches branch "${branch}".`);
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title
            });

            core.info(`Updated PR title to "${title}".`);
