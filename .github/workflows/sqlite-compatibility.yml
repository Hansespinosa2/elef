name: SQLite compatibility

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    - cron: "31 6 * * 1"

permissions:
  contents: read

jobs:
  full-sqlite-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/web
          bundler-cache: true
      - name: Build Tailwind CSS
        working-directory: apps/web
        run: bin/rails tailwindcss:build
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rails-owned frontend dependencies
        run: npm ci
      - name: Build the shared packages
        # dist/ is built, never committed: every lane builds before consuming.
        # client/renderer/editor-runtime form a build-time cycle, so the exact
        # bootstrap order inside `npm run build:packages` matters; call it whole.
        run: npm run build:packages
      - name: Run the full non-system Ruby suite on SQLite
        working-directory: apps/web
        env:
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        run: bin/rails db:test:prepare test
