name: Web performance (non-gating)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 4"

permissions:
  contents: read

concurrency:
  group: web-performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elef_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d elef_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/web
          bundler-cache: true
      - name: Build Tailwind CSS
        working-directory: apps/web
        run: bin/rails tailwindcss:build
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rails-owned frontend dependencies
        run: npm ci
      - name: Build the shared packages
        # dist/ is untracked; benchmark the current sources on fresh runners.
        run: npm run build:packages
      - name: Install reference system fonts
        # The manifest's rendered_pages counts reproduce only when generic
        # sans-serif/serif resolve to Liberation (reference layout); Ubuntu
        # runners otherwise prefer DejaVu/Noto and paginate differently.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fontconfig
          sudo cp apps/web/test/fixtures/performance/reference-fonts.conf /etc/fonts/conf.d/99-elef-perf-reference.conf
          sudo fc-cache -f >/dev/null
          fc-match "sans-serif" | grep -q "Liberation Sans"
          fc-match "serif" | grep -q "Liberation Serif"
          echo "--- elef perf font snapshot ---"
          for family in sans-serif serif monospace system-ui ui-sans-serif Georgia "Times New Roman" Arial; do
            printf "%-16s => " "$family"; fc-match "$family" || true
          done
          echo "installed: Liberation=$(fc-list | grep -ci liberation) DejaVu=$(fc-list | grep -ci dejavu) Noto=$(fc-list | grep -ci noto) Ubuntu=$(fc-list | grep -ci ubuntu)"
      - name: Record web performance over twenty samples per fixture
        env:
          RAILS_ENV: test
          PARALLEL_WORKERS: "1"
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGTESTDATABASE: elef_test
          ELEF_PERF_MODE: measure
          ELEF_PERF_REPORT: ${{ github.workspace }}/web-performance.json
          ELEF_PERF_RUNNER: ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})
        working-directory: apps/web
        run: |
          bin/rails db:test:prepare
          bin/rails test test/performance/visual_pages_test.rb -n test_measure_visual_page_benchmarks
      - name: Preserve web performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-performance
          path: ${{ github.workspace }}/web-performance.json
          if-no-files-found: warn
