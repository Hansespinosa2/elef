name: Web performance (non-gating)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 4"

permissions:
  contents: read

concurrency:
  group: web-performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elef_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d elef_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/web
          bundler-cache: true
      - name: Build Tailwind CSS
        working-directory: apps/web
        run: bin/rails tailwindcss:build
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rails-owned frontend dependencies
        run: npm ci
      - name: Build the shared packages
        # dist/ is untracked; benchmark the current sources on fresh runners.
        run: npm run build:packages
      - name: Install reference system fonts
        # The manifest's rendered_pages counts reproduce only when generic
        # sans-serif/serif resolve to Liberation (reference layout); Ubuntu
        # runners otherwise prefer DejaVu/Noto and paginate differently.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fontconfig
          sudo cp apps/web/test/fixtures/performance/reference-fonts.conf /etc/fonts/conf.d/99-elef-perf-reference.conf
          sudo fc-cache -f >/dev/null
          fc-match "sans-serif" | grep -q "Liberation Sans"
          fc-match "serif" | grep -q "Liberation Serif"
      - name: Dump CI font inventory (diagnostic)
        run: |
          echo "=== fc-match sorts ==="
          fc-match -s "sans-serif" | head -8
          fc-match -s "serif" | head -8
          fc-match -s "monospace" | head -8
          fc-match "Georgia"
          echo "=== installed font families ==="
          fc-list : family | sort -u | head -100
          echo "=== liberation files ==="
          fc-list "Liberation Sans" file | head -5
          dpkg -l | grep -iE "fonts-|fontconfig" | head -30
      - name: Preserve web performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-performance
          path: ${{ github.workspace }}/web-performance.json
          if-no-files-found: warn
