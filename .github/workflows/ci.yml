name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  desktop-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend
      - name: Run the fast desktop unit tier
        run: |
          started=$SECONDS
          npm test --prefix desktop/frontend
          cargo test --manifest-path desktop/Cargo.toml -p elef-core --locked
          elapsed=$((SECONDS - started))
          echo "Fast desktop test tier: ${elapsed}s (budget: 300s)"
          test "$elapsed" -lt 300

  scan_ruby:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elef_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d elef_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build
      - name: Run tests
        env:
          RAILS_ENV: test
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGTESTDATABASE: elef_test
        run: bin/rails db:test:prepare test
      - name: Run deterministic JavaScript unit tests
        run: |
          node test/javascript/bug_report_events.test.mjs
          node --test test/javascript/document_link_palette.test.mjs test/javascript/editor_markdown_math.test.mjs test/javascript/math_shorthand.test.mjs test/javascript/mermaid_syntax.test.mjs test/javascript/mermaid_runtime.test.mjs test/javascript/media_transfer.test.mjs test/javascript/pptx_export.test.mjs
      - name: Check repository launchers and deployment files
        run: |
          bash test/scripts/elef-agent_test.sh
          bash test/scripts/personal_instance_test.sh
          bash test/scripts/development_instance_test.sh
          bash test/scripts/deployment_ref_monotonicity_test.sh
          bash test/scripts/deployment_authorization_test.sh
          ruby test/scripts/ci_single_run_test.rb

  sqlite-test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build
      - name: Run SQLite compatibility tests
        env:
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        run: bin/rails db:test:prepare test

  system-test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elef_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d elef_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build
      - name: Run System Tests
        env:
          RAILS_ENV: test
          PARALLEL_WORKERS: "1"
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGTESTDATABASE: elef_test
        run: |
          bin/rails db:test:prepare
          bin/rails test test/system
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            desktop/e2e/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl dbus-daemon file iptables libayatana-appindicator3-dev libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev openbox patchelf unzip wget xdotool xvfb zip
      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend
      - name: Install shared scenario dependencies
        run: npm ci --prefix desktop/e2e
      - name: Audit desktop JavaScript dependencies
        run: |
          npm audit --prefix desktop/frontend --audit-level=high
          npm audit --prefix desktop/e2e --audit-level=high
      - name: Install pinned Cargo audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit desktop Rust dependencies
        # R13 (Andres; review/expiry 2026-12-01): fxhash via Tauri selector (RUSTSEC-2025-0057),
        # proc-macro-error and glib via GTK 0.18 (RUSTSEC-2024-0370, RUSTSEC-2024-0429),
        # and rand via Tauri selector (RUSTSEC-2026-0097). Remove each ignore when updated.
        run: cargo audit --file desktop/Cargo.lock --deny warnings --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0097
      - name: Test and bundle desktop frontend
        run: |
          npm test --prefix desktop/frontend
          npm run build --prefix desktop/frontend
      - name: Verify the Rails renderer bundle is current
        run: git diff --exit-code -- vendor/javascript/elef-renderer.bundle.js
      - name: Check command allowlist and CSP
        run: python3 desktop/scripts/check_architecture.py
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - name: Lint desktop Rust workspace
        run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test desktop Rust workspace
        run: cargo test --manifest-path desktop/Cargo.toml --workspace
      - name: Build Rails styles for shared browser scenarios
        run: bin/rails tailwindcss:build
      - name: Prepare the isolated Rails E2E database
        env:
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        run: bin/rails db:test:prepare
      - name: Install headless browser and system dependencies
        run: npx --prefix desktop/e2e playwright install --with-deps chromium
      - name: Build test-only desktop binary with WebdriverIO capability
        run: ELEF_E2E_BUILD=1 npm run tauri:build --prefix desktop/frontend -- --debug --no-bundle --features webdriver --config src-tauri/tauri.e2e.conf.json
      - name: Run shared scenarios with external network blocked
        env:
          CI: "true"
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        # Tauri's Linux single-instance plugin uses a user D-Bus name.
        run: |
          restore_firewall() {
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
            sudo iptables -D OUTPUT ! -o lo -j REJECT 2>/dev/null || true
            sudo ip6tables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
            sudo ip6tables -D OUTPUT ! -o lo -j REJECT 2>/dev/null || true
          }
          trap restore_firewall EXIT
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
          sudo ip6tables -I OUTPUT 2 ! -o lo -j REJECT
          if curl --noproxy '*' --silent --fail --max-time 3 https://example.com >/dev/null; then
            echo "External network remained reachable during the offline desktop scenario run"
            exit 1
          fi
          dbus-run-session -- xvfb-run --auto-servernum bash -c 'openbox --sm-disable >/tmp/elef-e2e-openbox.log 2>&1 & sleep 1; npm test --prefix desktop/e2e'
      - name: Build Linux desktop package
        run: npm run tauri:build --prefix desktop/frontend

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            desktop/e2e/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Install frontend dependencies
        run: npm ci --prefix desktop/frontend
      - name: Install shared scenario dependencies
        run: npm ci --prefix desktop/e2e
      - name: Audit desktop JavaScript dependencies
        run: |
          npm audit --prefix desktop/frontend --audit-level=high
          npm audit --prefix desktop/e2e --audit-level=high
      - name: Test and bundle desktop frontend
        run: |
          npm test --prefix desktop/frontend
          npm run build --prefix desktop/frontend
      - name: Verify the Rails renderer bundle is current
        run: git diff --exit-code -- vendor/javascript/elef-renderer.bundle.js
      - name: Check command allowlist and CSP
        run: python3 desktop/scripts/check_architecture.py
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - name: Lint desktop Rust workspace
        run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test desktop Rust workspace
        run: cargo test --manifest-path desktop/Cargo.toml --workspace
      - name: Build Rails styles for shared browser scenarios
        run: bin/rails tailwindcss:build
      - name: Prepare the isolated Rails E2E database
        env:
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        run: bin/rails db:test:prepare
      - name: Install headless web browser
        run: npx --prefix desktop/e2e playwright install chromium
      - name: Build test-only desktop binary with WebdriverIO capability
        run: ELEF_E2E_BUILD=1 npm run tauri:build --prefix desktop/frontend -- --debug --no-bundle --features webdriver --config src-tauri/tauri.e2e.conf.json
      - name: Run shared web and desktop scenarios
        env:
          CI: "true"
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        run: npm test --prefix desktop/e2e
      - name: Build Apple Silicon desktop package
        run: npm run tauri:build --prefix desktop/frontend -- --bundles app,dmg

  renderer-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Ruby and install the locked bundle
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Build the shared renderer bundle
        run: |
          npm ci --prefix desktop/frontend
          npm run build --prefix desktop/frontend
      - name: Verify the Rails renderer bundle is current
        run: git diff --exit-code -- vendor/javascript/elef-renderer.bundle.js
      - name: Exercise Rails rendering on Apple Silicon macOS
        env:
          RAILS_ENV: test
          ELEF_USE_SQLITE: "1"
        run: |
          bin/rails db:test:prepare
          bin/rails test test/lib/source/renderer_test.rb test/lib/authoring_registry_test.rb test/models/presentation_test.rb test/services/presentations/pptx_export_test.rb

  production-smoke:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate production Compose configuration
        run: docker compose --project-name elef-ci --env-file .env.personal.example --file compose.personal.yml config --quiet
      - name: Build production image
        run: docker compose --project-name elef-ci --env-file .env.personal.example --file compose.personal.yml build web
      - name: Boot and smoke-test production stack
        run: |
          set -euo pipefail
          compose=(docker compose --project-name elef-ci --env-file .env.personal.example --file compose.personal.yml)
          cleanup() {
            "${compose[@]}" down -v --remove-orphans
          }
          trap cleanup EXIT
          "${compose[@]}" up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              "${compose[@]}" ps
              "${compose[@]}" logs web db
              exit 1
            fi
            sleep 2
          done
          "${compose[@]}" exec -T web bin/rails runner 'abort "wrong Rails environment" unless Rails.env.production?; abort "wrong database adapter" unless ActiveRecord::Base.connection.adapter_name == "PostgreSQL"; storage = Rails.root.join("storage"); probe = storage.join(".write-check"); File.write(probe, "ok"); File.delete(probe); puts "production smoke ok"'

  development-smoke:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate development Compose configuration
        run: docker compose --project-name elef-development-ci --env-file .env.development.example --file compose.development.yml config --quiet
      - name: Build development image
        run: docker compose --project-name elef-development-ci --env-file .env.development.example --file compose.development.yml build web
      - name: Prepare and smoke-test development stack
        run: |
          set -euo pipefail
          compose=(docker compose --project-name elef-development-ci --env-file .env.development.example --file compose.development.yml)
          cleanup() {
            "${compose[@]}" down -v --remove-orphans
          }
          trap cleanup EXIT
          "${compose[@]}" up -d db
          "${compose[@]}" run --rm --no-deps web bin/rails db:prepare
          "${compose[@]}" run --rm --no-deps web bin/rails runner 'abort "wrong Rails environment" unless Rails.env.development?; abort "wrong database adapter" unless ActiveRecord::Base.connection.adapter_name == "PostgreSQL"; storage = Rails.root.join("storage"); probe = storage.join(".write-check"); File.write(probe, "ok"); File.delete(probe); puts "development smoke ok"'

  record-ci-attestation:
    if: github.event_name == 'pull_request'
    needs: [ desktop-fast, scan_ruby, scan_js, test, sqlite-test, system-test, desktop, desktop-macos, renderer-macos, production-smoke, development-smoke ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull request test candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Record the tested source tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --argjson workflow_run_id "$WORKFLOW_RUN_ID" \
            --argjson run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg tested_sha "$GITHUB_SHA" \
            --arg tested_tree "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            '{pr_number: $pr_number, workflow_run_id: $workflow_run_id, run_attempt: $run_attempt, tested_sha: $tested_sha, tested_tree: $tested_tree}' \
            > deployment-attestation.json
      - name: Upload the deployment attestation
        uses: actions/upload-artifact@v7
        with:
          name: ci-attestation-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: deployment-attestation.json
          if-no-files-found: error
          retention-days: 30

  publish-deployment-ref:
    name: Authorize deployment after CI
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify the merged PR's seven CI checks and tested tree
        env:
          DEPLOYMENT_REMOTE: origin
        run: scripts/verify-deployment-authorization
      - name: Publish the CI-approved deployment ref
        env:
          DEPLOYMENT_REMOTE: origin
        run: scripts/publish-deployment-ref
