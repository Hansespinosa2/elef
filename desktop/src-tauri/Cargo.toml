[package]
name = "elef-desktop"
version = "0.1.0"
description = "Offline-first desktop authoring for Elef decks"
authors = ["Elef"]
edition = "2024"
publish = false

[features]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "elef_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "elef-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = ["config-json"] }

[dependencies]
elef-core = { path = "../crates/elef-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-process = "=2.3.1"
tauri-plugin-single-instance = "=2.3.4"
tauri-plugin-updater = "=2.13.0"
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
tempfile = "3"
