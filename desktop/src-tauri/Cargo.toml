[package]
name = "elef-desktop"
version = "0.1.0"
description = "Offline-first desktop authoring for Elef decks"
authors = ["Elef"]
edition = "2024"
publish = false

[lib]
name = "elef_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "elef-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = ["config-json"] }

[dependencies]
elef-core = { path = "../crates/elef-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-single-instance = "=2.3.4"
